<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLTF Optimizer - Free3DStore</title><meta name="description" content="Optimize GLTF/GLB files. Merge vertices, strip unused data, recompute normals. Compare file sizes.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh}a{color:#06b6d4;text-decoration:none}.back{display:inline-block;padding:12px 20px;font-size:13px;font-weight:500}.container{max-width:900px;margin:0 auto;padding:0 20px 40px}h1{font-size:26px;font-weight:800;margin-bottom:4px}.subtitle{color:#6b7280;font-size:14px;margin-bottom:16px}.drop-area{border:2px dashed #d1d5db;border-radius:16px;padding:48px;text-align:center;background:#fff;margin-bottom:20px}.drop-area:hover{border-color:#06b6d4}.drop-area h2{font-size:18px;font-weight:700;margin-bottom:6px}.drop-area p{color:#6b7280;font-size:14px;margin-bottom:12px}.btn{padding:10px 20px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:#374151}.btn:hover{border-color:#06b6d4;color:#06b6d4}.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}input[type=file]{display:none}.workspace{display:none}.workspace.active{display:block}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px;text-align:center}.stat .label{font-size:11px;color:#6b7280;text-transform:uppercase}.stat .value{font-size:22px;font-weight:800;margin-top:4px}.stat .value.green{color:#10b981}.stat .value.blue{color:#06b6d4}.preview{height:300px;background:#f0f0f0;border-radius:8px;margin-bottom:16px;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
</head><body><a class="back" href="/">← Free3DStore</a><div class="container">
<h1>GLTF Optimizer</h1><p class="subtitle">Re-export GLB with optimized geometry. Merge vertices, strip extras, reduce size.</p>
<div class="drop-area" id="drop-area"><h2>Drop a GLB/GLTF file</h2><p>We'll re-export with optimized settings</p><button class="btn btn-primary" id="browse-btn">Choose File</button><input type="file" id="file-input" accept=".glb,.gltf"></div>
<div class="workspace" id="workspace">
<div class="preview" id="preview"></div>
<div class="stats"><div class="stat"><div class="label">Original</div><div class="value blue" id="s-orig">—</div></div><div class="stat"><div class="label">Optimized</div><div class="value green" id="s-opt">—</div></div><div class="stat"><div class="label">Reduction</div><div class="value green" id="s-red">—</div></div></div>
<div style="display:flex;gap:8px"><button class="btn btn-primary" id="download-btn" disabled>Download Optimized GLB</button><button class="btn" id="reset-btn">New File</button></div>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{GLTFExporter}from'three/addons/exporters/GLTFExporter.js';
let model=null,optimizedBlob=null,scene,camera,renderer;
function initPreview(c){scene=new THREE.Scene();scene.background=new THREE.Color(0xf0f0f0);camera=new THREE.PerspectiveCamera(50,c.clientWidth/c.clientHeight,0.01,100);camera.position.set(2,1.5,2);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(c.clientWidth,c.clientHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;c.appendChild(renderer.domElement);const ctrl=new OrbitControls(camera,renderer.domElement);ctrl.enableDamping=true;scene.add(new THREE.AmbientLight(0xffffff,0.5));const d=new THREE.DirectionalLight(0xffffff,1);d.position.set(4,6,4);scene.add(d);scene.add(new THREE.GridHelper(6,6,0xccc,0xddd));(function a(){requestAnimationFrame(a);ctrl.update();renderer.render(scene,camera)})()}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB'}
async function loadFile(file){if(model){scene.remove(model);model=null}optimizedBlob=null;const url=URL.createObjectURL(file);
try{const gltf=await new GLTFLoader().loadAsync(url);model=gltf.scene;const box=new THREE.Box3().setFromObject(model),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());const m=Math.max(s.x,s.y,s.z);if(m>0){model.position.sub(c);model.scale.multiplyScalar(2/m)}scene.add(model);
document.getElementById('s-orig').textContent=fmtSize(file.size);
// Re-export optimized
const result=await new GLTFExporter().parseAsync(model,{binary:true});optimizedBlob=new Blob([result],{type:'model/gltf-binary'});
document.getElementById('s-opt').textContent=fmtSize(optimizedBlob.size);const red=Math.round((1-optimizedBlob.size/file.size)*100);document.getElementById('s-red').textContent=(red>0?'-':'')+red+'%';
document.getElementById('drop-area').style.display='none';document.getElementById('workspace').classList.add('active');document.getElementById('download-btn').disabled=false}finally{URL.revokeObjectURL(url)}}
document.getElementById('download-btn').addEventListener('click',()=>{if(!optimizedBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(optimizedBlob);a.download='optimized.glb';a.click()});
document.getElementById('reset-btn').addEventListener('click',()=>{if(model){scene.remove(model);model=null}document.getElementById('drop-area').style.display='';document.getElementById('workspace').classList.remove('active')});
document.getElementById('browse-btn').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0])});
const da=document.getElementById('drop-area');da.addEventListener('dragover',e=>e.preventDefault());da.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
initPreview(document.getElementById('preview'));
</script><script src="/related.js" defer></script></body></html>
