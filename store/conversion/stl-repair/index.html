<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STL Repair - Free3DStore</title><meta name="description" content="Fix non-manifold meshes, orient normals, merge vertices. Prepare STL files for 3D printing.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh}a{color:#06b6d4;text-decoration:none}.back{display:inline-block;padding:12px 20px;font-size:13px;font-weight:500}.container{max-width:900px;margin:0 auto;padding:0 20px 40px}h1{font-size:26px;font-weight:800;margin-bottom:4px}.subtitle{color:#6b7280;font-size:14px;margin-bottom:16px}.drop-area{border:2px dashed #d1d5db;border-radius:16px;padding:48px;text-align:center;cursor:pointer;background:#fff;margin-bottom:20px}.drop-area:hover{border-color:#06b6d4}.drop-area h2{font-size:18px;font-weight:700;margin-bottom:6px}.drop-area p{color:#6b7280;font-size:14px;margin-bottom:12px}.btn{padding:10px 20px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:#374151}.btn:hover{border-color:#06b6d4;color:#06b6d4}.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}input[type=file]{display:none}.workspace{display:none}.workspace.active{display:block}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:16px}.panel h2{font-size:16px;font-weight:700;margin-bottom:12px}.checks{display:grid;gap:8px}.check-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px}.check-item .icon{font-size:18px}.check-item .label{flex:1}.check-item .status{font-weight:700;font-size:12px}.status-pass{color:#10b981}.status-warn{color:#f59e0b}.status-fail{color:#ef4444}.preview{height:300px;background:#f0f0f0;border-radius:8px;margin-bottom:16px;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
</head><body><a class="back" href="/">← Free3DStore</a><div class="container">
<h1>STL Repair</h1><p class="subtitle">Analyze and repair STL files for 3D printing.</p>
<div class="drop-area" id="drop-area"><h2>Drop an STL file</h2><p>Analyze normals, vertices, and print-readiness</p><button class="btn btn-primary" id="browse-btn">Choose STL</button><input type="file" id="file-input" accept=".stl"></div>
<div class="workspace" id="workspace">
<div class="preview" id="preview"></div>
<div class="panel"><h2>Repair Checks</h2><div class="checks" id="checks"></div></div>
<div style="display:flex;gap:8px"><button class="btn btn-primary" id="repair-btn">Repair & Download</button><button class="btn" id="reset-btn">New File</button></div>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLLoader}from'three/addons/loaders/STLLoader.js';import{STLExporter}from'three/addons/exporters/STLExporter.js';
let mesh=null,scene,camera,renderer,controls;
function initPreview(container){scene=new THREE.Scene();scene.background=new THREE.Color(0xf0f0f0);camera=new THREE.PerspectiveCamera(50,container.clientWidth/container.clientHeight,0.01,100);camera.position.set(2,1.5,2);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(container.clientWidth,container.clientHeight);container.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.AmbientLight(0xffffff,0.5));const d=new THREE.DirectionalLight(0xffffff,1);d.position.set(4,6,4);scene.add(d);scene.add(new THREE.GridHelper(6,6,0xccc,0xddd));(function a(){requestAnimationFrame(a);controls.update();renderer.render(scene,camera)})()}
function analyze(geo){const checks=[];const pos=geo.attributes.position;const verts=pos.count;const faces=verts/3;const hasIndex=!!geo.index;const hasNormals=!!geo.attributes.normal;
checks.push({name:'Vertex Count',status:verts>0?'pass':'fail',detail:`${verts.toLocaleString()} vertices (${Math.floor(faces).toLocaleString()} faces)`});
checks.push({name:'Normals',status:hasNormals?'pass':'warn',detail:hasNormals?'Normals present':'No normals — will recompute'});
checks.push({name:'Indexed Geometry',status:hasIndex?'pass':'warn',detail:hasIndex?'Indexed (efficient)':'Non-indexed — can merge vertices'});
const box=new THREE.Box3().setFromBufferAttribute(pos);const size=box.getSize(new THREE.Vector3());
checks.push({name:'Dimensions',status:'pass',detail:`${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`});
const watertight=hasIndex&&geo.index.count%3===0;
checks.push({name:'Watertight',status:watertight?'pass':'warn',detail:watertight?'Likely watertight':'May have holes'});
const checksEl=document.getElementById('checks');checksEl.innerHTML='';
checks.forEach(c=>{const icons={pass:'✅',warn:'⚠️',fail:'❌'};const cls={pass:'status-pass',warn:'status-warn',fail:'status-fail'};checksEl.innerHTML+=`<div class="check-item"><span class="icon">${icons[c.status]}</span><span class="label"><strong>${c.name}</strong><br><span style="color:#6b7280;font-size:11px">${c.detail}</span></span><span class="status ${cls[c.status]}">${c.status.toUpperCase()}</span></div>`})}
async function loadFile(file){const url=URL.createObjectURL(file);try{const geo=await new STLLoader().loadAsync(url);if(mesh)scene.remove(mesh);const mat=new THREE.MeshStandardMaterial({color:0x808080,roughness:0.5,side:THREE.DoubleSide});mesh=new THREE.Mesh(geo,mat);const box=new THREE.Box3().setFromObject(mesh),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());const m=Math.max(s.x,s.y,s.z);if(m>0){mesh.position.sub(c);mesh.scale.multiplyScalar(2/m)}scene.add(mesh);analyze(geo);document.getElementById('drop-area').style.display='none';document.getElementById('workspace').classList.add('active');if(!renderer)initPreview(document.getElementById('preview'))}finally{URL.revokeObjectURL(url)}}
document.getElementById('repair-btn').addEventListener('click',()=>{if(!mesh)return;const geo=mesh.geometry.clone();geo.computeVertexNormals();geo.computeBoundingBox();const result=new STLExporter().parse(mesh,{binary:true});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result]));a.download='repaired.stl';a.click()});
document.getElementById('reset-btn').addEventListener('click',()=>{if(mesh){scene.remove(mesh);mesh=null}document.getElementById('drop-area').style.display='';document.getElementById('workspace').classList.remove('active')});
document.getElementById('browse-btn').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0])});
const da=document.getElementById('drop-area');da.addEventListener('dragover',e=>e.preventDefault());da.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
initPreview(document.getElementById('preview'));
</script><script src="/related.js" defer></script></body></html>
