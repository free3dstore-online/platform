<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Comparison - Free3DStore</title>
<meta name="description" content="Side-by-side 3D model comparison with synced cameras. Compare before/after optimization, different LODs, or format conversions.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh}
a{color:#06b6d4;text-decoration:none}
.back{display:inline-block;padding:12px 20px;font-size:13px;font-weight:500}
.container{max-width:1200px;margin:0 auto;padding:0 20px 40px}
h1{font-size:26px;font-weight:800;margin-bottom:4px}
.subtitle{color:#6b7280;font-size:14px;margin-bottom:16px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:768px){.compare{grid-template-columns:1fr}}
.pane{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.pane-head{padding:8px 14px;background:#f9fafb;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.pane-head .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#e5e7eb;color:#6b7280}
.pane-canvas{height:380px;position:relative}
.pane-canvas canvas{width:100%;height:100%;display:block}
.drop-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#6b7280;font-size:13px;cursor:pointer}
.drop-msg.hidden{display:none}
.drop-msg b{color:#1a1a1a;font-size:16px}
.pane-stats{padding:6px 14px;font-size:11px;color:#6b7280;display:flex;gap:12px;border-top:1px solid #f3f4f6}
.pane-stats strong{color:#1a1a1a}
.btn{padding:8px 16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#374151}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}
.btn-primary:hover{background:#0891b2}
input[type="file"]{display:none}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls .btn.active{background:#06b6d4;color:#fff;border-color:#06b6d4}
</style>
</head>
<body>
<a class="back" href="/">← Free3DStore</a>
<div class="container">
<h1>Model Comparison</h1>
<p class="subtitle">Drop two models to compare side-by-side with synced cameras.</p>
<div class="controls" style="margin-bottom:12px">
  <button class="btn active" id="btn-sync">Sync Cameras</button>
  <button class="btn" id="btn-wire">Wireframe</button>
  <button class="btn" id="btn-swap">Swap</button>
</div>
<div class="compare">
  <div class="pane" id="pane-a">
    <div class="pane-head"><span>Model A</span><span class="tag" id="tag-a">Drop file</span></div>
    <div class="pane-canvas" id="vp-a">
      <div class="drop-msg" id="drop-a"><b>Drop Model A</b><span>or click to browse</span></div>
    </div>
    <div class="pane-stats"><span>Verts: <strong id="va">—</strong></span><span>Faces: <strong id="fa">—</strong></span><span>Size: <strong id="sa">—</strong></span></div>
    <input type="file" id="file-a" accept=".glb,.gltf,.obj,.stl,.fbx">
  </div>
  <div class="pane" id="pane-b">
    <div class="pane-head"><span>Model B</span><span class="tag" id="tag-b">Drop file</span></div>
    <div class="pane-canvas" id="vp-b">
      <div class="drop-msg" id="drop-b"><b>Drop Model B</b><span>or click to browse</span></div>
    </div>
    <div class="pane-stats"><span>Verts: <strong id="vb">—</strong></span><span>Faces: <strong id="fb">—</strong></span><span>Size: <strong id="sb">—</strong></span></div>
    <input type="file" id="file-b" accept=".glb,.gltf,.obj,.stl,.fbx">
  </div>
</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

let syncCams = true, wireMode = false;
const viewers = {};

function createViewer(container) {
  const s = new THREE.Scene(); s.background = new THREE.Color(0xf0f0f0);
  const c = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.01, 100);
  c.position.set(2, 1.5, 2);
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setSize(container.clientWidth, container.clientHeight); r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.toneMapping = THREE.ACESFilmicToneMapping;
  container.appendChild(r.domElement);
  const ctrl = new OrbitControls(c, r.domElement); ctrl.enableDamping = true;
  s.add(new THREE.AmbientLight(0xffffff, 0.5));
  const d = new THREE.DirectionalLight(0xffffff, 1); d.position.set(4, 6, 4); s.add(d);
  s.add(new THREE.GridHelper(6, 6, 0xccc, 0xddd));
  return { scene: s, camera: c, renderer: r, controls: ctrl, model: null };
}

function initViewers() {
  viewers.a = createViewer(document.getElementById('vp-a'));
  viewers.b = createViewer(document.getElementById('vp-b'));
  // Sync cameras
  viewers.a.controls.addEventListener('change', () => {
    if (!syncCams) return;
    viewers.b.camera.position.copy(viewers.a.camera.position);
    viewers.b.camera.rotation.copy(viewers.a.camera.rotation);
    viewers.b.controls.target.copy(viewers.a.controls.target);
  });
  viewers.b.controls.addEventListener('change', () => {
    if (!syncCams) return;
    viewers.a.camera.position.copy(viewers.b.camera.position);
    viewers.a.camera.rotation.copy(viewers.b.camera.rotation);
    viewers.a.controls.target.copy(viewers.b.controls.target);
  });
  (function anim() {
    requestAnimationFrame(anim);
    viewers.a.controls.update(); viewers.a.renderer.render(viewers.a.scene, viewers.a.camera);
    viewers.b.controls.update(); viewers.b.renderer.render(viewers.b.scene, viewers.b.camera);
  })();
}

function countGeo(obj) {
  let v=0, f=0;
  obj.traverse(c => { if (c.isMesh && c.geometry) { v += c.geometry.attributes.position?.count||0; f += c.geometry.index ? c.geometry.index.count/3 : (c.geometry.attributes.position?.count||0)/3; }});
  return { v, f: Math.floor(f) };
}

async function loadInto(side, file) {
  const vw = viewers[side];
  if (vw.model) { vw.scene.remove(vw.model); vw.model = null; }
  const ext = file.name.split('.').pop().toLowerCase(), url = URL.createObjectURL(file);
  try {
    let obj;
    if (ext==='glb'||ext==='gltf') obj=(await new GLTFLoader().loadAsync(url)).scene;
    else if (ext==='obj') obj=await new OBJLoader().loadAsync(url);
    else if (ext==='stl') obj=new THREE.Mesh(await new STLLoader().loadAsync(url), new THREE.MeshStandardMaterial({color:0x808080,roughness:.5}));
    else if (ext==='fbx') obj=await new FBXLoader().loadAsync(url);
    else { alert('Unsupported: '+ext); return; }
    const box=new THREE.Box3().setFromObject(obj), center=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z); if(maxDim>0){obj.position.sub(center);obj.scale.multiplyScalar(2/maxDim);}
    if (wireMode) obj.traverse(c => { if (c.isMesh) c.material.wireframe = true; });
    vw.scene.add(obj); vw.model = obj;
    const stats = countGeo(obj);
    document.getElementById('v'+side).textContent = stats.v.toLocaleString();
    document.getElementById('f'+side).textContent = stats.f.toLocaleString();
    document.getElementById('s'+side).textContent = file.size>1048576?(file.size/1048576).toFixed(1)+'MB':(file.size/1024).toFixed(0)+'KB';
    document.getElementById('tag-'+side).textContent = ext.toUpperCase();
    document.getElementById('drop-'+side).classList.add('hidden');
  } finally { URL.revokeObjectURL(url); }
}

// Controls
document.getElementById('btn-sync').addEventListener('click', function() { syncCams = !syncCams; this.classList.toggle('active', syncCams); });
document.getElementById('btn-wire').addEventListener('click', function() {
  wireMode = !wireMode; this.classList.toggle('active', wireMode);
  ['a','b'].forEach(s => { if (viewers[s]?.model) viewers[s].model.traverse(c => { if (c.isMesh) c.material.wireframe = wireMode; }); });
});
document.getElementById('btn-swap').addEventListener('click', () => {
  const ma = viewers.a.model, mb = viewers.b.model;
  if (ma) { viewers.a.scene.remove(ma); viewers.b.scene.add(ma); }
  if (mb) { viewers.b.scene.remove(mb); viewers.a.scene.add(mb); }
  viewers.a.model = mb; viewers.b.model = ma;
  // Swap stats display
  ['v','f','s'].forEach(k => {
    const ea = document.getElementById(k+'a'), eb = document.getElementById(k+'b');
    const tmp = ea.textContent; ea.textContent = eb.textContent; eb.textContent = tmp;
  });
  const ta = document.getElementById('tag-a'), tb = document.getElementById('tag-b');
  const tmp = ta.textContent; ta.textContent = tb.textContent; tb.textContent = tmp;
});

// File inputs + drag/drop
['a','b'].forEach(side => {
  const vp = document.getElementById('vp-'+side);
  const fi = document.getElementById('file-'+side);
  const dm = document.getElementById('drop-'+side);
  dm.addEventListener('click', () => fi.click());
  fi.addEventListener('change', e => { if (e.target.files[0]) loadInto(side, e.target.files[0]); });
  vp.addEventListener('dragover', e => e.preventDefault());
  vp.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadInto(side, e.dataTransfer.files[0]); });
});

initViewers();
</script>
<script src="/related.js" defer></script>
</body>
</html>
