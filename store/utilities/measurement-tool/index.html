<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measurement Tool - Free3DStore</title>
<meta name="description" content="Measure distances, dimensions, and surface area on 3D models. Click two points to measure. Bounding box dimensions with ruler.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
a{color:#06b6d4;text-decoration:none}
.topbar{display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}
.topbar a{font-size:13px;color:#6b7280}
.topbar h1{font-size:17px;font-weight:800}
.topbar .spacer{flex:1}
.btn{padding:8px 16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#374151}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
.btn.active{background:#06b6d4;color:#fff;border-color:#06b6d4}
.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}
input[type="file"]{display:none}
.workspace{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;padding:16px;flex-shrink:0}
.viewport{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block;cursor:crosshair}
.drop-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#6b7280;z-index:10;background:#fafafa}
.drop-overlay h2{font-size:20px;font-weight:700;color:#1a1a1a}
.drop-overlay.hidden{display:none}
.section{margin-bottom:16px}
.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:8px}
.meas-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.meas-card .label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.3px}
.meas-card .value{font-size:20px;font-weight:800;color:#06b6d4;margin-top:2px}
.meas-card .unit{font-size:12px;color:#6b7280;font-weight:500}
.stat-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.stat-row .k{color:#6b7280}
.stat-row .v{font-weight:600}
.measurements-list{max-height:200px;overflow-y:auto}
.m-item{display:flex;align-items:center;gap:8px;padding:6px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;margin-bottom:4px;font-size:11px}
.m-item .m-color{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.m-item .m-val{font-weight:700;color:#06b6d4;margin-left:auto}
.m-item .m-del{cursor:pointer;opacity:.4;padding:2px}
.m-item .m-del:hover{opacity:1;color:#ef4444}
.hint{font-size:11px;color:#6b7280;padding:8px;background:#f9fafb;border-radius:6px;line-height:1.6}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Free3DStore</a>
  <h1>Measurement Tool</h1>
  <span class="spacer"></span>
  <button class="btn active" id="btn-measure">Measure Mode</button>
  <button class="btn" id="btn-clear">Clear All</button>
  <button class="btn" id="browse-btn">Open Model</button>
  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.fbx">
</div>
<div class="workspace">
  <div class="sidebar">
    <div class="section">
      <h3>Bounding Box</h3>
      <div class="stat-row"><span class="k">Width (X)</span><span class="v" id="bb-x">—</span></div>
      <div class="stat-row"><span class="k">Height (Y)</span><span class="v" id="bb-y">—</span></div>
      <div class="stat-row"><span class="k">Depth (Z)</span><span class="v" id="bb-z">—</span></div>
      <div class="stat-row"><span class="k">Diagonal</span><span class="v" id="bb-diag">—</span></div>
    </div>
    <div class="section">
      <h3>Surface Area</h3>
      <div class="meas-card"><div class="label">Total Surface</div><div class="value" id="surface">—</div></div>
    </div>
    <div class="section">
      <h3>Measurements</h3>
      <div class="measurements-list" id="meas-list"></div>
      <div class="hint" id="hint">Click two points on the model to measure distance between them.</div>
    </div>
  </div>
  <div class="viewport" id="viewport">
    <canvas id="canvas"></canvas>
    <div class="drop-overlay" id="drop-overlay">
      <h2>Drop a 3D model to measure</h2>
      <p>Click any two points to measure distance</p>
      <button class="btn btn-primary" id="drop-browse">Choose File</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('canvas'), vp = document.getElementById('viewport');
let model = null, measureMode = true, firstPoint = null;
const measurements = [];
const measGroup = new THREE.Group();
const colors = [0x06b6d4, 0xf97316, 0x22c55e, 0x8b5cf6, 0xef4444, 0xeab308];

const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf0f0f0);
const camera = new THREE.PerspectiveCamera(50, vp.clientWidth/vp.clientHeight, 0.01, 100);
camera.position.set(2.5, 2, 2.5);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 1); dl.position.set(5, 8, 5); scene.add(dl);
scene.add(new THREE.GridHelper(8, 8, 0xccc, 0xddd));
scene.add(measGroup);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

(function anim() { requestAnimationFrame(anim); orbit.update(); renderer.render(scene, camera); })();
window.addEventListener('resize', () => { camera.aspect=vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(vp.clientWidth, vp.clientHeight); });

function computeSurfaceArea(obj) {
  let area = 0;
  const v = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  obj.traverse(ch => {
    if (!ch.isMesh) return;
    const geo = ch.geometry;
    const pos = geo.attributes.position;
    if (geo.index) {
      const idx = geo.index;
      for (let i = 0; i < idx.count; i += 3) {
        a.fromBufferAttribute(pos, idx.getX(i));
        b.fromBufferAttribute(pos, idx.getX(i+1));
        c.fromBufferAttribute(pos, idx.getX(i+2));
        v.crossVectors(b.clone().sub(a), c.clone().sub(a));
        area += v.length() * 0.5;
      }
    } else {
      for (let i = 0; i < pos.count; i += 3) {
        a.fromBufferAttribute(pos, i);
        b.fromBufferAttribute(pos, i+1);
        c.fromBufferAttribute(pos, i+2);
        v.crossVectors(b.clone().sub(a), c.clone().sub(a));
        area += v.length() * 0.5;
      }
    }
  });
  return area;
}

async function loadModel(file) {
  if (model) { scene.remove(model); model = null; }
  clearMeasurements();
  const ext = file.name.split('.').pop().toLowerCase(), url = URL.createObjectURL(file);
  try {
    let obj;
    if (ext==='glb'||ext==='gltf') obj=(await new GLTFLoader().loadAsync(url)).scene;
    else if (ext==='obj') obj=await new OBJLoader().loadAsync(url);
    else if (ext==='stl') obj=new THREE.Mesh(await new STLLoader().loadAsync(url), new THREE.MeshStandardMaterial({color:0x808080,roughness:.5}));
    else if (ext==='fbx') obj=await new FBXLoader().loadAsync(url);
    else { alert('Unsupported'); return; }
    const box=new THREE.Box3().setFromObject(obj), center=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z); if(maxDim>0){obj.position.sub(center);obj.scale.multiplyScalar(2/maxDim);}
    scene.add(obj); model = obj;

    // Bounding box
    const bb = new THREE.Box3().setFromObject(obj);
    const s = bb.getSize(new THREE.Vector3());
    document.getElementById('bb-x').textContent = s.x.toFixed(3);
    document.getElementById('bb-y').textContent = s.y.toFixed(3);
    document.getElementById('bb-z').textContent = s.z.toFixed(3);
    document.getElementById('bb-diag').textContent = s.length().toFixed(3);
    scene.add(new THREE.Box3Helper(bb, 0x06b6d4));

    // Surface area
    const area = computeSurfaceArea(obj);
    document.getElementById('surface').textContent = area.toFixed(3) + ' units²';

    document.getElementById('drop-overlay').classList.add('hidden');
  } finally { URL.revokeObjectURL(url); }
}

// Measurement by clicking
canvas.addEventListener('click', e => {
  if (!measureMode || !model) return;
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  model.traverse(c => { if (c.isMesh) meshes.push(c); });
  const hits = raycaster.intersectObjects(meshes, false);
  if (!hits.length) return;

  const point = hits[0].point.clone();

  // Create marker
  const marker = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), new THREE.MeshBasicMaterial({ color: colors[measurements.length % colors.length] }));
  marker.position.copy(point);
  measGroup.add(marker);

  if (!firstPoint) {
    firstPoint = { point, marker };
    document.getElementById('hint').textContent = 'Click a second point to complete measurement.';
  } else {
    const dist = firstPoint.point.distanceTo(point);
    const color = colors[measurements.length % colors.length];

    // Draw line
    const geo = new THREE.BufferGeometry().setFromPoints([firstPoint.point, point]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, linewidth: 2 }));
    measGroup.add(line);

    measurements.push({ from: firstPoint.point, to: point, dist, line, markers: [firstPoint.marker, marker], color });
    firstPoint = null;
    updateMeasList();
    document.getElementById('hint').textContent = 'Click two points on the model to measure distance between them.';
  }
});

function updateMeasList() {
  const list = document.getElementById('meas-list');
  list.innerHTML = '';
  measurements.forEach((m, i) => {
    const div = document.createElement('div'); div.className = 'm-item';
    div.innerHTML = `<div class="m-color" style="background:#${m.color.toString(16).padStart(6, '0')}"></div><span>#${i + 1}</span><span class="m-val">${m.dist.toFixed(4)}</span><span class="m-del" title="Remove">x</span>`;
    div.querySelector('.m-del').addEventListener('click', () => {
      measGroup.remove(m.line); m.markers.forEach(mk => measGroup.remove(mk));
      measurements.splice(i, 1);
      updateMeasList();
    });
    list.appendChild(div);
  });
}

function clearMeasurements() {
  while (measGroup.children.length) measGroup.remove(measGroup.children[0]);
  measurements.length = 0; firstPoint = null;
  updateMeasList();
}

document.getElementById('btn-measure').addEventListener('click', function() { measureMode = !measureMode; this.classList.toggle('active', measureMode); canvas.style.cursor = measureMode ? 'crosshair' : 'grab'; });
document.getElementById('btn-clear').addEventListener('click', clearMeasurements);
document.getElementById('browse-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('drop-browse').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) loadModel(e.target.files[0]); });
vp.addEventListener('dragover', e => e.preventDefault());
vp.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadModel(e.dataTransfer.files[0]); });
</script>
<script src="/related.js" defer></script>
</body>
</html>
