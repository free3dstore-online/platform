<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesh Inspector - Free3DStore</title>
<meta name="description" content="Analyze 3D models in detail. Vertex count, face count, bounding box, materials, draw calls, geometry breakdown. Wireframe and normals visualization.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
a{color:#06b6d4;text-decoration:none}
.topbar{display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}
.topbar a{font-size:13px;color:#6b7280}
.topbar h1{font-size:17px;font-weight:800}
.topbar .spacer{flex:1}
.btn{padding:8px 16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#374151;transition:all .15s}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}
.btn.active{background:#06b6d4;color:#fff;border-color:#06b6d4}
input[type="file"]{display:none}
.workspace{display:flex;flex:1;overflow:hidden}
.viewport{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block}
.drop-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;background:#fafafa}
.drop-overlay h2{font-size:22px;font-weight:700}
.drop-overlay p{font-size:14px;color:#6b7280}
.drop-overlay.hidden{display:none}
.sidebar{width:320px;background:#fff;border-left:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0}
.section{border-bottom:1px solid #f3f4f6;padding:12px 16px}
.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px}
.stat-card .label{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.3px}
.stat-card .value{font-size:18px;font-weight:800;color:#1a1a1a;margin-top:2px}
.stat-card .value.accent{color:#06b6d4}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.stat-row .k{color:#6b7280}
.stat-row .v{font-weight:600}
.mesh-item{padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.mesh-item:last-child{border:none}
.mesh-item .name{font-weight:600;margin-bottom:2px}
.mesh-item .detail{color:#6b7280;font-size:11px}
.view-btns{display:flex;gap:4px;flex-wrap:wrap}
.view-btns .btn{padding:5px 10px;font-size:11px}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Free3DStore</a>
  <h1>Mesh Inspector</h1>
  <span class="spacer"></span>
  <button class="btn" id="browse-btn">Open Model</button>
  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.fbx">
</div>
<div class="workspace">
  <div class="viewport" id="viewport">
    <canvas id="canvas"></canvas>
    <div class="drop-overlay" id="drop-overlay">
      <h2>Drop a 3D model to inspect</h2>
      <p>GLB, OBJ, STL, FBX — see every detail</p>
      <button class="btn btn-primary" id="drop-browse">Choose File</button>
    </div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="section">
      <h3>Overview</h3>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Vertices</div><div class="value accent" id="s-verts">—</div></div>
        <div class="stat-card"><div class="label">Faces</div><div class="value accent" id="s-faces">—</div></div>
        <div class="stat-card"><div class="label">Meshes</div><div class="value" id="s-meshes">—</div></div>
        <div class="stat-card"><div class="label">Materials</div><div class="value" id="s-mats">—</div></div>
      </div>
    </div>
    <div class="section">
      <h3>Bounding Box</h3>
      <div id="bbox-stats"></div>
    </div>
    <div class="section">
      <h3>Visualization</h3>
      <div class="view-btns">
        <button class="btn active" id="v-solid">Solid</button>
        <button class="btn" id="v-wire">Wireframe</button>
        <button class="btn" id="v-uv">UV Check</button>
        <button class="btn" id="v-normal">Normals</button>
        <button class="btn" id="v-depth">Depth</button>
      </div>
    </div>
    <div class="section">
      <h3>Mesh Breakdown</h3>
      <div id="mesh-list"></div>
    </div>
    <div class="section">
      <h3>Geometry Details</h3>
      <div id="geo-details"></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('canvas'), vp = document.getElementById('viewport');
let model = null, origMats = [], bboxHelper = null;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf0f0f0);
const camera = new THREE.PerspectiveCamera(50, vp.clientWidth/vp.clientHeight, 0.01, 200);
camera.position.set(2.5, 2, 2.5);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 1); dl.position.set(5, 8, 5); scene.add(dl);
scene.add(new THREE.GridHelper(8, 8, 0xccc, 0xddd));

const checkerTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#06b6d4' : '#ffffff';
    ctx.fillRect(x * 16, y * 16, 16, 16);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
})();

const depthMat = new THREE.MeshDepthMaterial();
const normalMat = new THREE.MeshNormalMaterial();
const uvMat = new THREE.MeshBasicMaterial({ map: checkerTex });
const wireMat = new THREE.MeshBasicMaterial({ wireframe: true, color: 0x06b6d4 });

(function anim() { requestAnimationFrame(anim); orbit.update(); renderer.render(scene, camera); })();
window.addEventListener('resize', () => { camera.aspect = vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(vp.clientWidth, vp.clientHeight); });

async function loadModel(file) {
  if (model) { scene.remove(model); model = null; }
  if (bboxHelper) { scene.remove(bboxHelper); bboxHelper = null; }
  origMats = [];
  const ext = file.name.split('.').pop().toLowerCase(), url = URL.createObjectURL(file);
  try {
    let obj;
    if (ext === 'glb' || ext === 'gltf') obj = (await new GLTFLoader().loadAsync(url)).scene;
    else if (ext === 'obj') obj = await new OBJLoader().loadAsync(url);
    else if (ext === 'stl') obj = new THREE.Mesh(await new STLLoader().loadAsync(url), new THREE.MeshStandardMaterial({ color: 0x808080 }));
    else if (ext === 'fbx') obj = await new FBXLoader().loadAsync(url);
    else { alert('Unsupported'); return; }

    const box = new THREE.Box3().setFromObject(obj), center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) { obj.position.sub(center); obj.scale.multiplyScalar(2 / maxDim); }
    scene.add(obj); model = obj;

    // Store original materials
    obj.traverse(c => { if (c.isMesh) origMats.push({ mesh: c, mat: c.material }); });

    // Bounding box
    const bb = new THREE.Box3().setFromObject(obj);
    bboxHelper = new THREE.Box3Helper(bb, 0x06b6d4);
    scene.add(bboxHelper);

    analyze(obj, file, bb);
    document.getElementById('drop-overlay').classList.add('hidden');
    setView('solid');
  } finally { URL.revokeObjectURL(url); }
}

function analyze(obj, file, bb) {
  let totalVerts = 0, totalFaces = 0, meshCount = 0;
  const materials = new Set();
  const meshes = [];
  let hasUVs = true, hasNormals = true, hasIndex = true;

  obj.traverse(c => {
    if (!c.isMesh) return;
    meshCount++;
    const g = c.geometry;
    const v = g.attributes.position?.count || 0;
    const f = g.index ? g.index.count / 3 : v / 3;
    totalVerts += v;
    totalFaces += f;
    if (c.material) materials.add(c.material.uuid);
    if (!g.attributes.uv) hasUVs = false;
    if (!g.attributes.normal) hasNormals = false;
    if (!g.index) hasIndex = false;
    meshes.push({ name: c.name || `mesh_${meshCount}`, verts: v, faces: Math.floor(f), mat: c.material });
  });

  document.getElementById('s-verts').textContent = totalVerts.toLocaleString();
  document.getElementById('s-faces').textContent = Math.floor(totalFaces).toLocaleString();
  document.getElementById('s-meshes').textContent = meshCount;
  document.getElementById('s-mats').textContent = materials.size;

  const size = bb.getSize(new THREE.Vector3());
  document.getElementById('bbox-stats').innerHTML = `
    <div class="stat-row"><span class="k">Width (X)</span><span class="v">${size.x.toFixed(3)}</span></div>
    <div class="stat-row"><span class="k">Height (Y)</span><span class="v">${size.y.toFixed(3)}</span></div>
    <div class="stat-row"><span class="k">Depth (Z)</span><span class="v">${size.z.toFixed(3)}</span></div>
    <div class="stat-row"><span class="k">File Size</span><span class="v">${file.size > 1048576 ? (file.size/1048576).toFixed(2)+' MB' : (file.size/1024).toFixed(1)+' KB'}</span></div>
  `;

  document.getElementById('mesh-list').innerHTML = meshes.map(m => `
    <div class="mesh-item">
      <div class="name">${m.name}</div>
      <div class="detail">${m.verts.toLocaleString()} verts | ${m.faces.toLocaleString()} faces${m.mat?.name ? ' | ' + m.mat.name : ''}</div>
    </div>
  `).join('');

  document.getElementById('geo-details').innerHTML = `
    <div class="stat-row"><span class="k">Has UVs</span><span class="v">${hasUVs ? 'Yes' : 'No'}</span></div>
    <div class="stat-row"><span class="k">Has Normals</span><span class="v">${hasNormals ? 'Yes' : 'No'}</span></div>
    <div class="stat-row"><span class="k">Indexed</span><span class="v">${hasIndex ? 'Yes' : 'No'}</span></div>
    <div class="stat-row"><span class="k">Draw Calls</span><span class="v">${meshCount}</span></div>
    <div class="stat-row"><span class="k">Triangles</span><span class="v">${Math.floor(totalFaces).toLocaleString()}</span></div>
    <div class="stat-row"><span class="k">Bytes/Vertex</span><span class="v">${totalVerts > 0 ? (file.size / totalVerts).toFixed(1) : '—'}</span></div>
  `;
}

function setView(mode) {
  document.querySelectorAll('.view-btns .btn').forEach(b => b.classList.remove('active'));
  document.getElementById('v-' + mode)?.classList.add('active');
  if (!model) return;
  origMats.forEach(({ mesh, mat }) => {
    switch (mode) {
      case 'solid': mesh.material = mat; break;
      case 'wire': mesh.material = wireMat; break;
      case 'uv': mesh.material = uvMat; break;
      case 'normal': mesh.material = normalMat; break;
      case 'depth': mesh.material = depthMat; break;
    }
  });
}

document.getElementById('v-solid').addEventListener('click', () => setView('solid'));
document.getElementById('v-wire').addEventListener('click', () => setView('wire'));
document.getElementById('v-uv').addEventListener('click', () => setView('uv'));
document.getElementById('v-normal').addEventListener('click', () => setView('normal'));
document.getElementById('v-depth').addEventListener('click', () => setView('depth'));

document.getElementById('browse-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('drop-browse').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) loadModel(e.target.files[0]); });
vp.addEventListener('dragover', e => e.preventDefault());
vp.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadModel(e.dataTransfer.files[0]); });
</script>
<script src="/related.js" defer></script>
</body>
</html>
