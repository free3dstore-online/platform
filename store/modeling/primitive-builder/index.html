<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primitive Builder - Free3DStore</title>
<meta name="description" content="Create parametric 3D primitives: box, sphere, cylinder, cone, torus, knot. Adjust dimensions, segments, material. Export as GLB or STL.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
a{color:#06b6d4;text-decoration:none}
.topbar{display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}
.topbar a{font-size:13px;color:#6b7280}
.topbar h1{font-size:17px;font-weight:800}
.workspace{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;padding:16px;flex-shrink:0}
.viewport{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block}
.section{margin-bottom:20px}
.section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:10px}
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shape-btn{padding:10px 4px;text-align:center;background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;cursor:pointer;font:inherit;font-size:11px;font-weight:600;color:#6b7280;transition:all .15s}
.shape-btn:hover{border-color:#06b6d4;color:#06b6d4}
.shape-btn.active{border-color:#06b6d4;background:rgba(6,182,212,.06);color:#06b6d4}
.param-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.param-row label{font-size:12px;font-weight:600;width:80px;flex-shrink:0;color:#4b5563}
.param-row input[type="range"]{flex:1;accent-color:#06b6d4}
.param-row .val{font-size:12px;font-weight:600;width:40px;text-align:right;color:#06b6d4}
.param-row input[type="color"]{width:32px;height:26px;border:1px solid #e5e7eb;border-radius:4px;cursor:pointer;padding:2px}
.btn{padding:10px 16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#374151;transition:all .15s;width:100%}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}
.btn-primary:hover{background:#0891b2}
.btn-group{display:flex;gap:6px;margin-top:8px}
.btn-group .btn{flex:1}
.stats{font-size:11px;color:#6b7280;margin-top:8px;padding:8px;background:#f9fafb;border-radius:6px}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Free3DStore</a>
  <h1>Primitive Builder</h1>
</div>
<div class="workspace">
  <div class="sidebar">
    <div class="section">
      <h3>Shape</h3>
      <div class="shape-grid">
        <button class="shape-btn active" data-shape="box">Box</button>
        <button class="shape-btn" data-shape="sphere">Sphere</button>
        <button class="shape-btn" data-shape="cylinder">Cylinder</button>
        <button class="shape-btn" data-shape="cone">Cone</button>
        <button class="shape-btn" data-shape="torus">Torus</button>
        <button class="shape-btn" data-shape="knot">Knot</button>
        <button class="shape-btn" data-shape="icosahedron">Icosa</button>
        <button class="shape-btn" data-shape="octahedron">Octa</button>
        <button class="shape-btn" data-shape="dodecahedron">Dodeca</button>
      </div>
    </div>
    <div class="section">
      <h3>Dimensions</h3>
      <div id="params"></div>
    </div>
    <div class="section">
      <h3>Material</h3>
      <div class="param-row"><label>Color</label><input type="color" id="mat-color" value="#5b9bd5"></div>
      <div class="param-row"><label>Metalness</label><input type="range" id="mat-metal" min="0" max="1" step="0.01" value="0.05"><span class="val" id="v-metal">0.05</span></div>
      <div class="param-row"><label>Roughness</label><input type="range" id="mat-rough" min="0" max="1" step="0.01" value="0.45"><span class="val" id="v-rough">0.45</span></div>
      <div class="param-row"><label>Wireframe</label><input type="checkbox" id="mat-wire" style="accent-color:#06b6d4"></div>
    </div>
    <div class="section">
      <h3>Export</h3>
      <div class="btn-group">
        <button class="btn btn-primary" id="export-glb">GLB</button>
        <button class="btn" id="export-stl">STL</button>
        <button class="btn" id="export-obj">OBJ</button>
      </div>
      <div class="stats" id="stats">Vertices: 0 | Faces: 0</div>
    </div>
  </div>
  <div class="viewport"><canvas id="canvas"></canvas></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';

const canvas = document.getElementById('canvas'), vp = canvas.parentElement;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf5f5f5);
const camera = new THREE.PerspectiveCamera(45, vp.clientWidth/vp.clientHeight, 0.01, 100);
camera.position.set(2.5, 2, 2.5);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 1); dl.position.set(4, 6, 4); dl.castShadow = true; scene.add(dl);
scene.add(new THREE.GridHelper(6, 6, 0xccc, 0xddd));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.ShadowMaterial({opacity:.15}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

let mesh = null, currentShape = 'box';
const mat = new THREE.MeshStandardMaterial({ color: 0x5b9bd5, roughness: 0.45, metalness: 0.05, side: THREE.DoubleSide });

// Shape parameter definitions
const shapeDefs = {
  box:         { params: [{n:'Width',min:.1,max:5,step:.1,def:1},{n:'Height',min:.1,max:5,step:.1,def:1},{n:'Depth',min:.1,max:5,step:.1,def:1},{n:'W Segs',min:1,max:20,step:1,def:1},{n:'H Segs',min:1,max:20,step:1,def:1},{n:'D Segs',min:1,max:20,step:1,def:1}], geo: a => new THREE.BoxGeometry(...a) },
  sphere:      { params: [{n:'Radius',min:.1,max:3,step:.05,def:.5},{n:'W Segs',min:4,max:64,step:1,def:32},{n:'H Segs',min:3,max:64,step:1,def:24}], geo: a => new THREE.SphereGeometry(...a) },
  cylinder:    { params: [{n:'Top R',min:0,max:3,step:.05,def:.5},{n:'Bot R',min:.05,max:3,step:.05,def:.5},{n:'Height',min:.1,max:5,step:.1,def:1},{n:'Segments',min:3,max:64,step:1,def:32}], geo: a => new THREE.CylinderGeometry(...a) },
  cone:        { params: [{n:'Radius',min:.05,max:3,step:.05,def:.5},{n:'Height',min:.1,max:5,step:.1,def:1},{n:'Segments',min:3,max:64,step:1,def:32}], geo: a => new THREE.ConeGeometry(...a) },
  torus:       { params: [{n:'Radius',min:.1,max:3,step:.05,def:.5},{n:'Tube',min:.01,max:1.5,step:.01,def:.18},{n:'Radial',min:3,max:32,step:1,def:16},{n:'Tubular',min:3,max:128,step:1,def:48}], geo: a => new THREE.TorusGeometry(...a) },
  knot:        { params: [{n:'Radius',min:.1,max:2,step:.05,def:.4},{n:'Tube',min:.01,max:.5,step:.01,def:.12},{n:'Tubular',min:16,max:256,step:4,def:100},{n:'Radial',min:3,max:32,step:1,def:16},{n:'P',min:1,max:10,step:1,def:2},{n:'Q',min:1,max:10,step:1,def:3}], geo: a => new THREE.TorusKnotGeometry(...a) },
  icosahedron: { params: [{n:'Radius',min:.1,max:3,step:.05,def:.5},{n:'Detail',min:0,max:5,step:1,def:0}], geo: a => new THREE.IcosahedronGeometry(...a) },
  octahedron:  { params: [{n:'Radius',min:.1,max:3,step:.05,def:.5},{n:'Detail',min:0,max:5,step:1,def:0}], geo: a => new THREE.OctahedronGeometry(...a) },
  dodecahedron:{ params: [{n:'Radius',min:.1,max:3,step:.05,def:.5},{n:'Detail',min:0,max:3,step:1,def:0}], geo: a => new THREE.DodecahedronGeometry(...a) },
};

const paramValues = {};

function buildParamUI(shape) {
  const container = document.getElementById('params');
  container.innerHTML = '';
  const def = shapeDefs[shape];
  paramValues[shape] = paramValues[shape] || def.params.map(p => p.def);
  def.params.forEach((p, i) => {
    const row = document.createElement('div'); row.className = 'param-row';
    row.innerHTML = `<label>${p.n}</label><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${paramValues[shape][i]}"><span class="val">${paramValues[shape][i]}</span>`;
    const input = row.querySelector('input');
    const val = row.querySelector('.val');
    input.addEventListener('input', () => {
      paramValues[shape][i] = parseFloat(input.value);
      val.textContent = Number.isInteger(p.step) ? input.value : parseFloat(input.value).toFixed(2);
      rebuildMesh();
    });
    container.appendChild(row);
  });
}

function rebuildMesh() {
  if (mesh) scene.remove(mesh);
  const def = shapeDefs[currentShape];
  const args = paramValues[currentShape] || def.params.map(p => p.def);
  const geo = def.geo(args);
  mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  // Place on ground
  const box = new THREE.Box3().setFromObject(mesh);
  mesh.position.y -= box.min.y;
  scene.add(mesh);
  // Stats
  const v = geo.attributes.position?.count || 0;
  const f = geo.index ? geo.index.count / 3 : v / 3;
  document.getElementById('stats').textContent = `Vertices: ${v.toLocaleString()} | Faces: ${Math.floor(f).toLocaleString()}`;
}

// Shape buttons
document.querySelectorAll('.shape-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentShape = btn.dataset.shape;
    buildParamUI(currentShape);
    rebuildMesh();
  });
});

// Material
document.getElementById('mat-color').addEventListener('input', function() { mat.color.set(this.value); });
document.getElementById('mat-metal').addEventListener('input', function() { mat.metalness = +this.value; document.getElementById('v-metal').textContent = (+this.value).toFixed(2); });
document.getElementById('mat-rough').addEventListener('input', function() { mat.roughness = +this.value; document.getElementById('v-rough').textContent = (+this.value).toFixed(2); });
document.getElementById('mat-wire').addEventListener('change', function() { mat.wireframe = this.checked; });

// Export
document.getElementById('export-glb').addEventListener('click', async () => {
  if (!mesh) return;
  const result = await new GLTFExporter().parseAsync(mesh, { binary: true });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([result])); a.download = `${currentShape}.glb`; a.click();
});
document.getElementById('export-stl').addEventListener('click', () => {
  if (!mesh) return;
  const result = new STLExporter().parse(mesh, { binary: true });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([result])); a.download = `${currentShape}.stl`; a.click();
});
document.getElementById('export-obj').addEventListener('click', () => {
  if (!mesh) return;
  const result = new OBJExporter().parse(mesh);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([result])); a.download = `${currentShape}.obj`; a.click();
});

(function anim() { requestAnimationFrame(anim); orbit.update(); renderer.render(scene, camera); })();
window.addEventListener('resize', () => { camera.aspect = vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(vp.clientWidth, vp.clientHeight); });

buildParamUI('box');
rebuildMesh();
</script>
<script src="/related.js" defer></script>
</body>
</html>
