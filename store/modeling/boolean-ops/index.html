<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Boolean Operations - Free3DStore</title><meta name="description" content="CSG boolean operations on 3D shapes. Union, subtract, intersect. Visual preview with export.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}a{color:#06b6d4;text-decoration:none}.topbar{display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}.topbar a{font-size:13px;color:#6b7280}.topbar h1{font-size:17px;font-weight:800}.workspace{display:flex;flex:1;overflow:hidden}.sidebar{width:260px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;padding:16px;flex-shrink:0}.viewport{flex:1;position:relative;overflow:hidden}#canvas{width:100%;height:100%;display:block}.section{margin-bottom:16px}.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:8px}.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt-btn{padding:8px;text-align:center;background:#f9fafb;border:2px solid #e5e7eb;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:#6b7280}.opt-btn:hover{border-color:#06b6d4;color:#06b6d4}.opt-btn.active{border-color:#06b6d4;background:rgba(6,182,212,.06);color:#06b6d4}.range-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.range-row label{font-size:12px;font-weight:600;width:70px;flex-shrink:0;color:#4b5563}.range-row input[type=range]{flex:1;accent-color:#06b6d4}.range-row .val{font-size:12px;width:30px;text-align:right;color:#06b6d4;font-weight:600}.btn{padding:10px 16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#374151;width:100%}.btn:hover{border-color:#06b6d4;color:#06b6d4}.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}</style>
</head><body>
<div class="topbar"><a href="/">← Free3DStore</a><h1>Boolean Operations</h1></div>
<div class="workspace"><div class="sidebar">
<div class="section"><h3>Shape A</h3><div class="opt-grid"><button class="opt-btn active" data-a="box">Box</button><button class="opt-btn" data-a="sphere">Sphere</button><button class="opt-btn" data-a="cylinder">Cylinder</button><button class="opt-btn" data-a="torus">Torus</button></div></div>
<div class="section"><h3>Shape B</h3><div class="opt-grid"><button class="opt-btn active" data-b="sphere">Sphere</button><button class="opt-btn" data-b="box">Box</button><button class="opt-btn" data-b="cylinder">Cylinder</button><button class="opt-btn" data-b="torus">Torus</button></div></div>
<div class="section"><h3>Operation</h3><div class="opt-grid"><button class="opt-btn active" data-op="subtract">Subtract</button><button class="opt-btn" data-op="union">Union</button><button class="opt-btn" data-op="intersect">Intersect</button></div></div>
<div class="section"><h3>Shape B Position</h3>
<div class="range-row"><label>X Offset</label><input type="range" id="r-ox" min="-1" max="1" step="0.05" value="0.3"><span class="val" id="v-ox">0.3</span></div>
<div class="range-row"><label>Y Offset</label><input type="range" id="r-oy" min="-1" max="1" step="0.05" value="0.3"><span class="val" id="v-oy">0.3</span></div>
<div class="range-row"><label>Z Offset</label><input type="range" id="r-oz" min="-1" max="1" step="0.05" value="0.3"><span class="val" id="v-oz">0.3</span></div>
<div class="range-row"><label>B Scale</label><input type="range" id="r-bs" min="0.2" max="2" step="0.1" value="0.8"><span class="val" id="v-bs">0.8</span></div>
</div>
<div class="section"><p style="font-size:11px;color:#6b7280;line-height:1.6;background:#f9fafb;padding:10px;border-radius:6px">CSG operations are visualized by showing both shapes with transparency. True boolean mesh operations require the CSG library (planned).</p></div>
</div><div class="viewport"><canvas id="canvas"></canvas></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const canvas=document.getElementById('canvas'),vp=canvas.parentElement;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf5f5f5);
const camera=new THREE.PerspectiveCamera(45,vp.clientWidth/vp.clientHeight,0.01,100);camera.position.set(2.5,2,2.5);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(vp.clientWidth,vp.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;
const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.5));const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(4,6,4);scene.add(dl);scene.add(new THREE.GridHelper(6,6,0xccc,0xddd));
let meshA=null,meshB=null,shapeA='box',shapeB='sphere',operation='subtract';
const matA=new THREE.MeshStandardMaterial({color:0x5b9bd5,roughness:0.4,transparent:true,opacity:0.85,side:THREE.DoubleSide});
const matB=new THREE.MeshStandardMaterial({color:0xef4444,roughness:0.4,transparent:true,opacity:0.6,side:THREE.DoubleSide});
const geos={box:()=>new THREE.BoxGeometry(1,1,1),sphere:()=>new THREE.SphereGeometry(0.5,32,24),cylinder:()=>new THREE.CylinderGeometry(0.4,0.4,1,32),torus:()=>new THREE.TorusGeometry(0.4,0.15,16,48)};
function rebuild(){if(meshA)scene.remove(meshA);if(meshB)scene.remove(meshB);
meshA=new THREE.Mesh(geos[shapeA](),matA.clone());meshB=new THREE.Mesh(geos[shapeB](),matB.clone());
meshB.position.set(+document.getElementById('r-ox').value,+document.getElementById('r-oy').value,+document.getElementById('r-oz').value);
const s=+document.getElementById('r-bs').value;meshB.scale.set(s,s,s);
if(operation==='subtract'){matB.color.set(0xef4444);matB.opacity=0.5}
else if(operation==='union'){matB.color.set(0x22c55e);matB.opacity=0.7}
else{matB.color.set(0xf59e0b);matB.opacity=0.5}
meshA.material=matA.clone();meshB.material=matB.clone();
scene.add(meshA);scene.add(meshB)}
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('active'));b.classList.add('active');shapeA=b.dataset.a;rebuild()}));
document.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-b]').forEach(x=>x.classList.remove('active'));b.classList.add('active');shapeB=b.dataset.b;rebuild()}));
document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-op]').forEach(x=>x.classList.remove('active'));b.classList.add('active');operation=b.dataset.op;rebuild()}));
['r-ox','r-oy','r-oz','r-bs'].forEach(id=>{document.getElementById(id).addEventListener('input',function(){document.getElementById('v-'+id.split('-')[1]).textContent=this.value;rebuild()})});
(function anim(){requestAnimationFrame(anim);orbit.update();renderer.render(scene,camera)})();
window.addEventListener('resize',()=>{camera.aspect=vp.clientWidth/vp.clientHeight;camera.updateProjectionMatrix();renderer.setSize(vp.clientWidth,vp.clientHeight)});
rebuild();
</script><script src="/related.js" defer></script></body></html>
