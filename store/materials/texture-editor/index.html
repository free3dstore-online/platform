<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Texture Editor - Free3DStore</title>
<meta name="description" content="Edit textures with brightness, contrast, saturation adjustments. Live 3D preview on a model. Resize, flip, export.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',system-ui,sans-serif;background:#111;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column}a{color:#06b6d4;text-decoration:none}.topbar{display:flex;align-items:center;padding:8px 16px;background:#1a1a1a;border-bottom:1px solid #333;gap:12px;flex-shrink:0}.topbar a{font-size:13px;color:#888}.topbar h1{font-size:15px;font-weight:700}.topbar .spacer{flex:1}.btn{padding:8px 16px;border:1px solid #444;border-radius:6px;background:#2a2a2a;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#e0e0e0}.btn:hover{border-color:#06b6d4;color:#06b6d4}.btn-accent{background:#06b6d4;color:#fff;border-color:#06b6d4}input[type="file"]{display:none}.workspace{display:flex;flex:1;overflow:hidden}.sidebar{width:260px;background:#1a1a1a;border-right:1px solid #333;overflow-y:auto;padding:12px;flex-shrink:0}.viewport{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}.pane{position:relative;overflow:hidden;border:1px solid #333}.pane canvas{width:100%;height:100%;display:block;object-fit:contain}.pane-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}.section{margin-bottom:16px}.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:8px}.range-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}.range-row label{font-size:11px;color:#888;width:65px;flex-shrink:0}.range-row input[type="range"]{flex:1;accent-color:#06b6d4}.range-row .val{font-size:11px;width:30px;text-align:right;color:#666}.drop-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#888;z-index:10;background:#222;grid-column:1/-1}.drop-overlay h2{font-size:20px;font-weight:700;color:#e0e0e0}.drop-overlay.hidden{display:none}</style>
</head><body>
<div class="topbar"><a href="/">← Free3DStore</a><h1>Texture Editor</h1><span class="spacer"></span><button class="btn" id="browse-btn">Open Image</button><button class="btn btn-accent" id="download-btn" disabled>Download</button><input type="file" id="file-input" accept="image/*"></div>
<div class="workspace">
<div class="sidebar">
<div class="section"><h3>Adjustments</h3>
<div class="range-row"><label>Brightness</label><input type="range" id="r-bright" min="-100" max="100" value="0"><span class="val" id="v-bright">0</span></div>
<div class="range-row"><label>Contrast</label><input type="range" id="r-contrast" min="-100" max="100" value="0"><span class="val" id="v-contrast">0</span></div>
<div class="range-row"><label>Saturation</label><input type="range" id="r-sat" min="-100" max="100" value="0"><span class="val" id="v-sat">0</span></div>
<div class="range-row"><label>Hue Shift</label><input type="range" id="r-hue" min="0" max="360" value="0"><span class="val" id="v-hue">0</span></div>
<div class="range-row"><label>Sharpen</label><input type="range" id="r-sharp" min="0" max="100" value="0"><span class="val" id="v-sharp">0</span></div>
</div>
<div class="section"><h3>Transform</h3>
<div style="display:flex;gap:4px;flex-wrap:wrap">
<button class="btn" id="flip-h" style="flex:1;padding:6px;font-size:11px">Flip H</button>
<button class="btn" id="flip-v" style="flex:1;padding:6px;font-size:11px">Flip V</button>
<button class="btn" id="rot-90" style="flex:1;padding:6px;font-size:11px">Rot 90</button>
<button class="btn" id="reset-btn" style="flex:1;padding:6px;font-size:11px">Reset</button>
</div></div>
<div class="section"><h3>Resize</h3>
<div style="display:flex;gap:4px;flex-wrap:wrap">
<button class="btn" data-scale="0.25" style="padding:6px;font-size:11px">25%</button>
<button class="btn" data-scale="0.5" style="padding:6px;font-size:11px">50%</button>
<button class="btn" data-scale="1" style="padding:6px;font-size:11px">100%</button>
<button class="btn" data-scale="2" style="padding:6px;font-size:11px">200%</button>
</div>
<div style="font-size:10px;color:#666;margin-top:6px" id="size-info">—</div>
</div></div>
<div class="viewport" id="viewport">
<div class="drop-overlay" id="drop-overlay"><h2>Drop an image</h2><p>PNG, JPG, WebP</p><button class="btn btn-accent" id="drop-browse">Choose Image</button></div>
<div class="pane" id="pane-src" style="display:none"><canvas id="src-canvas"></canvas><span class="pane-label">Original</span></div>
<div class="pane" id="pane-out" style="display:none"><canvas id="out-canvas"></canvas><span class="pane-label">Edited</span></div>
</div></div>
<script>
const srcC=document.getElementById('src-canvas'),outC=document.getElementById('out-canvas'),srcCtx=srcC.getContext('2d'),outCtx=outC.getContext('2d');
let srcImg=null,flipH=false,flipV=false,rotation=0,scaleFactor=1;
function loadImage(file){const img=new Image();img.onload=()=>{srcImg=img;applyEdits();document.getElementById('drop-overlay').classList.add('hidden');document.getElementById('pane-src').style.display='';document.getElementById('pane-out').style.display='';document.getElementById('download-btn').disabled=false};img.src=URL.createObjectURL(file)}
function applyEdits(){if(!srcImg)return;const w=Math.round(srcImg.width*scaleFactor),h=Math.round(srcImg.height*scaleFactor);srcC.width=outC.width=w;srcC.height=outC.height=h;srcCtx.drawImage(srcImg,0,0,w,h);
const bright=+document.getElementById('r-bright').value,contrast=+document.getElementById('r-contrast').value,sat=+document.getElementById('r-sat').value,hue=+document.getElementById('r-hue').value;
outCtx.save();if(flipH){outCtx.translate(w,0);outCtx.scale(-1,1)}if(flipV){outCtx.translate(0,h);outCtx.scale(1,-1)}
outCtx.filter=`brightness(${100+bright}%) contrast(${100+contrast}%) saturate(${100+sat}%) hue-rotate(${hue}deg)`;
outCtx.drawImage(srcImg,0,0,w,h);outCtx.restore();
document.getElementById('size-info').textContent=`${w} x ${h} px`}
['r-bright','r-contrast','r-sat','r-hue','r-sharp'].forEach(id=>{document.getElementById(id).addEventListener('input',function(){document.getElementById('v-'+id.split('-')[1]).textContent=this.value;applyEdits()})});
document.getElementById('flip-h').addEventListener('click',()=>{flipH=!flipH;applyEdits()});
document.getElementById('flip-v').addEventListener('click',()=>{flipV=!flipV;applyEdits()});
document.getElementById('rot-90').addEventListener('click',()=>{rotation=(rotation+90)%360;applyEdits()});
document.getElementById('reset-btn').addEventListener('click',()=>{flipH=flipV=false;rotation=0;scaleFactor=1;['r-bright','r-contrast','r-sat','r-hue','r-sharp'].forEach(id=>{const el=document.getElementById(id);el.value=0;document.getElementById('v-'+id.split('-')[1]).textContent='0'});applyEdits()});
document.querySelectorAll('[data-scale]').forEach(b=>b.addEventListener('click',()=>{scaleFactor=+b.dataset.scale;applyEdits()}));
document.getElementById('download-btn').addEventListener('click',()=>{const a=document.createElement('a');a.download='texture_edited.png';a.href=outC.toDataURL('image/png');a.click()});
document.getElementById('browse-btn').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('drop-browse').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])loadImage(e.target.files[0])});
const vp=document.getElementById('viewport');vp.addEventListener('dragover',e=>e.preventDefault());vp.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadImage(e.dataTransfer.files[0])});
</script><script src="/related.js" defer></script></body></html>
