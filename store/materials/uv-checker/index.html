<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UV Checker - Free3DStore</title>
<meta name="description" content="Visualize UV mapping on 3D models with checker patterns. Detect stretching, overlaps, and seams. Multiple checker styles.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
a{color:#06b6d4;text-decoration:none}
.topbar{display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}
.topbar a{font-size:13px;color:#6b7280}
.topbar h1{font-size:17px;font-weight:800}
.topbar .spacer{flex:1}
.btn{padding:8px 16px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#374151}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
.btn.active{background:#06b6d4;color:#fff;border-color:#06b6d4}
.btn-primary{background:#06b6d4;color:#fff;border-color:#06b6d4}
input[type="file"]{display:none}
.workspace{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;padding:16px;flex-shrink:0}
.viewport{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block}
.drop-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#6b7280;z-index:10;background:#fafafa}
.drop-overlay h2{font-size:20px;font-weight:700;color:#1a1a1a}
.drop-overlay.hidden{display:none}
.section{margin-bottom:16px}
.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:8px}
.pattern-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pat-btn{padding:8px;text-align:center;background:#f9fafb;border:2px solid #e5e7eb;border-radius:6px;cursor:pointer;font:inherit;font-size:11px;font-weight:600;color:#6b7280}
.pat-btn:hover{border-color:#06b6d4;color:#06b6d4}
.pat-btn.active{border-color:#06b6d4;background:rgba(6,182,212,.06);color:#06b6d4}
.range-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.range-row label{font-size:12px;font-weight:600;width:60px;flex-shrink:0;color:#4b5563}
.range-row input[type="range"]{flex:1;accent-color:#06b6d4}
.range-row .val{font-size:12px;width:30px;text-align:right;color:#06b6d4;font-weight:600}
.info-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px;font-size:11px;color:#6b7280;line-height:1.6}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Free3DStore</a>
  <h1>UV Checker</h1>
  <span class="spacer"></span>
  <button class="btn" id="browse-btn">Open Model</button>
  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.fbx">
</div>
<div class="workspace">
  <div class="sidebar">
    <div class="section">
      <h3>Checker Pattern</h3>
      <div class="pattern-grid">
        <button class="pat-btn active" data-pat="checker">Checker</button>
        <button class="pat-btn" data-pat="color">Color Grid</button>
        <button class="pat-btn" data-pat="numbers">Numbers</button>
        <button class="pat-btn" data-pat="gradient">Gradient</button>
      </div>
    </div>
    <div class="section">
      <h3>Settings</h3>
      <div class="range-row"><label>Repeat</label><input type="range" id="r-repeat" min="1" max="32" step="1" value="8"><span class="val" id="v-repeat">8</span></div>
      <div class="range-row"><label>Overlay</label><input type="checkbox" id="c-wire" style="accent-color:#06b6d4"><span style="font-size:11px;color:#6b7280">Wireframe</span></div>
    </div>
    <div class="section">
      <h3>UV Info</h3>
      <div class="info-box" id="uv-info">Load a model to analyze UVs</div>
    </div>
  </div>
  <div class="viewport" id="viewport">
    <canvas id="canvas"></canvas>
    <div class="drop-overlay" id="drop-overlay">
      <h2>Drop a 3D model</h2>
      <p>Visualize UV mapping with checker patterns</p>
      <button class="btn btn-primary" id="drop-browse">Choose File</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('canvas'), vp = document.getElementById('viewport');
let model = null, origMats = [], wireOverlay = null, currentPattern = 'checker', repeatCount = 8;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x333333);
const camera = new THREE.PerspectiveCamera(50, vp.clientWidth/vp.clientHeight, 0.01, 100);
camera.position.set(2, 1.5, 2);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 0.5); dl.position.set(3, 5, 3); scene.add(dl);
scene.add(new THREE.GridHelper(6, 6, 0x555, 0x444));

function makeCheckerTex(repeat) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const size = 512 / (repeat * 2);
  for (let y = 0; y < repeat * 2; y++) for (let x = 0; x < repeat * 2; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#06b6d4' : '#ffffff';
    ctx.fillRect(x * size, y * size, size, size);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; return t;
}

function makeColorTex(repeat) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const size = 512 / repeat;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
  for (let y = 0; y < repeat; y++) for (let x = 0; x < repeat; x++) {
    ctx.fillStyle = colors[(x + y * repeat) % colors.length];
    ctx.fillRect(x * size, y * size, size, size);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function makeNumberTex(repeat) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const size = 512 / repeat;
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, 512, 512);
  ctx.font = `bold ${Math.max(10, size * 0.4)}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let y = 0; y < repeat; y++) for (let x = 0; x < repeat; x++) {
    const i = y * repeat + x;
    ctx.strokeStyle = '#333'; ctx.strokeRect(x * size, y * size, size, size);
    ctx.fillStyle = `hsl(${(i * 37) % 360}, 70%, 60%)`;
    ctx.fillText(i, x * size + size / 2, y * size + size / 2);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function makeGradientTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, '#ef4444'); grad.addColorStop(0.33, '#22c55e'); grad.addColorStop(0.66, '#3b82f6'); grad.addColorStop(1, '#f97316');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function getPatternTex() {
  switch (currentPattern) {
    case 'checker': return makeCheckerTex(repeatCount);
    case 'color': return makeColorTex(repeatCount);
    case 'numbers': return makeNumberTex(repeatCount);
    case 'gradient': return makeGradientTex();
  }
}

function applyPattern() {
  if (!model) return;
  const tex = getPatternTex();
  model.traverse(c => {
    if (!c.isMesh) return;
    c.material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
  });
}

async function loadModel(file) {
  if (model) { scene.remove(model); model = null; }
  if (wireOverlay) { scene.remove(wireOverlay); wireOverlay = null; }
  origMats = [];
  const ext = file.name.split('.').pop().toLowerCase(), url = URL.createObjectURL(file);
  try {
    let obj;
    if (ext==='glb'||ext==='gltf') obj=(await new GLTFLoader().loadAsync(url)).scene;
    else if (ext==='obj') obj=await new OBJLoader().loadAsync(url);
    else if (ext==='stl') obj=new THREE.Mesh(await new STLLoader().loadAsync(url), new THREE.MeshBasicMaterial());
    else if (ext==='fbx') obj=await new FBXLoader().loadAsync(url);
    else { alert('Unsupported'); return; }
    const box=new THREE.Box3().setFromObject(obj), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
    const m=Math.max(s.x,s.y,s.z); if(m>0){obj.position.sub(c);obj.scale.multiplyScalar(2/m);}
    model = obj; scene.add(model);

    // Analyze UVs
    let hasUV = true, totalV = 0, totalF = 0, meshCount = 0;
    obj.traverse(ch => { if (!ch.isMesh) return; meshCount++; const g = ch.geometry;
      totalV += g.attributes.position?.count||0; totalF += g.index?g.index.count/3:(g.attributes.position?.count||0)/3;
      if (!g.attributes.uv) hasUV = false;
    });
    document.getElementById('uv-info').innerHTML = `
      <div><strong>${hasUV ? 'UVs found' : 'No UVs!'}</strong></div>
      <div>${meshCount} mesh${meshCount!==1?'es':''} | ${totalV.toLocaleString()} verts | ${Math.floor(totalF).toLocaleString()} faces</div>
      ${!hasUV ? '<div style="color:#ef4444;margin-top:4px">This model has no UV coordinates. Checker pattern will not display correctly.</div>' : ''}
    `;

    applyPattern();
    document.getElementById('drop-overlay').classList.add('hidden');
  } finally { URL.revokeObjectURL(url); }
}

// Pattern buttons
document.querySelectorAll('.pat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPattern = btn.dataset.pat;
    applyPattern();
  });
});

document.getElementById('r-repeat').addEventListener('input', function() {
  repeatCount = +this.value; document.getElementById('v-repeat').textContent = this.value;
  applyPattern();
});

document.getElementById('c-wire').addEventListener('change', function() {
  if (wireOverlay) { scene.remove(wireOverlay); wireOverlay = null; }
  if (this.checked && model) {
    wireOverlay = new THREE.Group();
    model.traverse(c => {
      if (!c.isMesh) return;
      const w = new THREE.LineSegments(new THREE.WireframeGeometry(c.geometry), new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.3, transparent: true }));
      w.position.copy(c.position); w.rotation.copy(c.rotation); w.scale.copy(c.scale);
      wireOverlay.add(w);
    });
    wireOverlay.position.copy(model.position); wireOverlay.scale.copy(model.scale);
    scene.add(wireOverlay);
  }
});

(function anim() { requestAnimationFrame(anim); orbit.update(); renderer.render(scene, camera); })();
window.addEventListener('resize', () => { camera.aspect=vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(vp.clientWidth, vp.clientHeight); });

document.getElementById('browse-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('drop-browse').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) loadModel(e.target.files[0]); });
vp.addEventListener('dragover', e => e.preventDefault());
vp.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadModel(e.dataTransfer.files[0]); });
</script>
<script src="/related.js" defer></script>
</body>
</html>
