<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Library - Free3DStore</title>
<meta name="description" content="Browse 30+ PBR materials: metals, woods, stones, plastics, fabrics. Live preview on sphere or your own model. Copy material settings.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
a{color:#06b6d4;text-decoration:none}
.topbar{display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}
.topbar a{font-size:13px;color:#6b7280}
.topbar h1{font-size:17px;font-weight:800}
.topbar .spacer{flex:1}
.btn{padding:6px 14px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:#374151}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
input[type="file"]{display:none}
.workspace{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0}
.viewport{flex:1;position:relative;overflow:hidden}
#canvas{width:100%;height:100%;display:block}
.cat-header{padding:8px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;background:#f9fafb;border-bottom:1px solid #e5e7eb;border-top:1px solid #e5e7eb;cursor:pointer}
.mat-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.mat-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px;font-size:12px;transition:background .1s}
.mat-item:hover{background:#f9fafb}
.mat-item.active{background:rgba(6,182,212,.06);border-left:3px solid #06b6d4}
.mat-swatch{width:28px;height:28px;border-radius:6px;flex-shrink:0;border:1px solid #e5e7eb}
.mat-info{flex:1;min-width:0}
.mat-name{font-weight:600;font-size:12px}
.mat-desc{font-size:10px;color:#6b7280;margin-top:1px}
.props-panel{padding:12px 14px;border-top:1px solid #e5e7eb;background:#f9fafb}
.props-panel h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:6px}
.prop-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
.prop-row .k{color:#6b7280}
.prop-row .v{font-weight:600;font-family:monospace}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Free3DStore</a>
  <h1>Material Library</h1>
  <span class="spacer"></span>
  <button class="btn" id="load-btn">Load Your Model</button>
  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl">
</div>
<div class="workspace">
  <div class="sidebar">
    <div id="mat-list"></div>
    <div class="props-panel" id="props-panel">
      <h3>Material Properties</h3>
      <div id="props-body">Select a material</div>
    </div>
  </div>
  <div class="viewport"><canvas id="canvas"></canvas></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const canvas = document.getElementById('canvas'), vp = canvas.parentElement;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf0f0f0);
const camera = new THREE.PerspectiveCamera(45, vp.clientWidth/vp.clientHeight, 0.01, 100);
camera.position.set(2, 1.5, 2);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true; orbit.autoRotate = true; orbit.autoRotateSpeed = 2;
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(4, 6, 4); scene.add(dl);
const fl = new THREE.DirectionalLight(0xaabbcc, 0.3); fl.position.set(-3, 3, -4); scene.add(fl);
scene.add(new THREE.GridHelper(6, 6, 0xccc, 0xddd));

let previewMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 64, 48), new THREE.MeshStandardMaterial());
previewMesh.position.y = 0.8;
scene.add(previewMesh);

const materials = {
  Metals: [
    { name:'Polished Steel', color:'#c0c0c0', metalness:0.95, roughness:0.05 },
    { name:'Brushed Aluminum', color:'#d4d4d4', metalness:0.9, roughness:0.3 },
    { name:'Gold', color:'#ffd700', metalness:1.0, roughness:0.1 },
    { name:'Copper', color:'#b87333', metalness:0.95, roughness:0.2 },
    { name:'Bronze', color:'#cd7f32', metalness:0.85, roughness:0.35 },
    { name:'Iron', color:'#555555', metalness:0.8, roughness:0.6 },
    { name:'Chrome', color:'#e8e8e8', metalness:1.0, roughness:0.02 },
    { name:'Titanium', color:'#878681', metalness:0.9, roughness:0.15 },
  ],
  Woods: [
    { name:'Oak', color:'#8B6914', metalness:0, roughness:0.7 },
    { name:'Walnut', color:'#5C4033', metalness:0, roughness:0.65 },
    { name:'Pine', color:'#C4A35A', metalness:0, roughness:0.75 },
    { name:'Cherry', color:'#7B3F00', metalness:0, roughness:0.6 },
    { name:'Ebony', color:'#1C1C1C', metalness:0, roughness:0.5 },
    { name:'Birch', color:'#D2B48C', metalness:0, roughness:0.7 },
  ],
  Stones: [
    { name:'Marble White', color:'#f5f0e8', metalness:0.02, roughness:0.15 },
    { name:'Marble Black', color:'#1a1a1a', metalness:0.02, roughness:0.15 },
    { name:'Granite', color:'#6d6d6d', metalness:0.05, roughness:0.65 },
    { name:'Slate', color:'#4a4a4a', metalness:0.03, roughness:0.8 },
    { name:'Sandstone', color:'#c2b280', metalness:0, roughness:0.9 },
    { name:'Concrete', color:'#999999', metalness:0, roughness:0.95 },
  ],
  Plastics: [
    { name:'Glossy Red', color:'#cc0000', metalness:0, roughness:0.05 },
    { name:'Glossy Blue', color:'#0066cc', metalness:0, roughness:0.05 },
    { name:'Matte White', color:'#f5f5f5', metalness:0, roughness:0.6 },
    { name:'Matte Black', color:'#222222', metalness:0, roughness:0.6 },
    { name:'Translucent', color:'#aaddff', metalness:0, roughness:0.1, opacity:0.6 },
    { name:'Rubber', color:'#333333', metalness:0, roughness:0.95 },
  ],
  Fabrics: [
    { name:'Cotton White', color:'#f0ede6', metalness:0, roughness:0.9 },
    { name:'Denim', color:'#1a3a5c', metalness:0, roughness:0.85 },
    { name:'Leather Brown', color:'#6b3a2a', metalness:0.05, roughness:0.7 },
    { name:'Silk', color:'#e8d4c0', metalness:0.1, roughness:0.2 },
    { name:'Velvet', color:'#4a0030', metalness:0, roughness:0.95 },
    { name:'Wool', color:'#c8b89a', metalness:0, roughness:0.92 },
  ],
};

// Build sidebar
const list = document.getElementById('mat-list');
for (const [cat, mats] of Object.entries(materials)) {
  const header = document.createElement('div'); header.className = 'cat-header'; header.textContent = `${cat} (${mats.length})`;
  list.appendChild(header);
  for (const m of mats) {
    const item = document.createElement('div'); item.className = 'mat-item';
    item.innerHTML = `<div class="mat-swatch" style="background:${m.color}"></div><div class="mat-info"><div class="mat-name">${m.name}</div><div class="mat-desc">M:${m.metalness.toFixed(1)} R:${m.roughness.toFixed(1)}</div></div>`;
    item.addEventListener('click', () => applyMaterial(m, item));
    list.appendChild(item);
  }
}

function applyMaterial(m, el) {
  document.querySelectorAll('.mat-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  const applyTo = obj => obj.traverse(c => {
    if (!c.isMesh) return;
    c.material.color.set(m.color);
    c.material.metalness = m.metalness;
    c.material.roughness = m.roughness;
    if (m.opacity !== undefined) { c.material.opacity = m.opacity; c.material.transparent = m.opacity < 1; }
    else { c.material.opacity = 1; c.material.transparent = false; }
  });
  applyTo(previewMesh);
  document.getElementById('props-body').innerHTML = `
    <div class="prop-row"><span class="k">Color</span><span class="v">${m.color}</span></div>
    <div class="prop-row"><span class="k">Metalness</span><span class="v">${m.metalness}</span></div>
    <div class="prop-row"><span class="k">Roughness</span><span class="v">${m.roughness}</span></div>
    ${m.opacity !== undefined ? `<div class="prop-row"><span class="k">Opacity</span><span class="v">${m.opacity}</span></div>` : ''}
    <div class="prop-row" style="margin-top:6px"><span class="k">CSS</span><span class="v" style="font-size:9px">color:${m.color}</span></div>
  `;
}

// Load custom model
document.getElementById('load-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase(), url = URL.createObjectURL(file);
  try {
    let obj;
    if (ext==='glb'||ext==='gltf') obj=(await new GLTFLoader().loadAsync(url)).scene;
    else if (ext==='obj') obj=await new OBJLoader().loadAsync(url);
    else if (ext==='stl') obj=new THREE.Mesh(await new STLLoader().loadAsync(url), new THREE.MeshStandardMaterial({color:0x808080}));
    else return;
    scene.remove(previewMesh);
    const box=new THREE.Box3().setFromObject(obj), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
    const m=Math.max(s.x,s.y,s.z); if(m>0){obj.position.sub(c);obj.scale.multiplyScalar(1.6/m);}
    const b2=new THREE.Box3().setFromObject(obj); obj.position.y-=b2.min.y;
    previewMesh = obj; scene.add(previewMesh);
  } finally { URL.revokeObjectURL(url); }
});

(function anim() { requestAnimationFrame(anim); orbit.update(); renderer.render(scene, camera); })();
window.addEventListener('resize', () => { camera.aspect=vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(vp.clientWidth, vp.clientHeight); });

// Apply first material
applyMaterial(materials.Metals[0], document.querySelector('.mat-item'));
</script>
<script src="/related.js" defer></script>
</body>
</html>
