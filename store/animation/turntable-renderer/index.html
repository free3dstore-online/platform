<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turntable Renderer - Free3DStore</title>
<meta name="description" content="Auto-rotate 3D models and export as GIF or PNG sequence. Adjust speed, lighting, background. Product showcase tool.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:#111;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column}
a{color:#06b6d4;text-decoration:none}
.topbar{display:flex;align-items:center;padding:8px 16px;background:#1a1a1a;border-bottom:1px solid #333;gap:12px;flex-shrink:0}
.topbar a{font-size:13px;color:#888}
.topbar h1{font-size:15px;font-weight:700}
.topbar .spacer{flex:1}
.btn{padding:8px 16px;border:1px solid #444;border-radius:6px;background:#2a2a2a;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#e0e0e0;transition:all .15s}
.btn:hover{border-color:#06b6d4;color:#06b6d4}
.btn-accent{background:#06b6d4;color:#fff;border-color:#06b6d4}
.btn-accent:hover{background:#0891b2}
.btn-accent:disabled{opacity:.5;cursor:not-allowed}
input[type="file"]{display:none}
.workspace{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:#1a1a1a;border-right:1px solid #333;overflow-y:auto;padding:12px;flex-shrink:0}
.viewport{flex:1;position:relative;overflow:hidden;background:#222}
#canvas{width:100%;height:100%;display:block}
.drop-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#888;z-index:10;background:#222}
.drop-overlay h2{font-size:22px;font-weight:700;color:#e0e0e0}
.drop-overlay p{font-size:14px}
.drop-overlay.hidden{display:none}
.section{margin-bottom:16px}
.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:8px}
.range-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.range-row label{font-size:11px;color:#888;width:60px;flex-shrink:0}
.range-row input[type="range"]{flex:1;accent-color:#06b6d4}
.range-row .val{font-size:11px;width:36px;text-align:right;color:#666}
select{font:inherit;font-size:12px;background:#222;border:1px solid #333;color:#e0e0e0;padding:4px 8px;border-radius:4px;width:100%}
.preview-strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.preview-strip img{width:48px;height:48px;border-radius:4px;border:1px solid #333}
.progress-bar{height:4px;background:#333;border-radius:2px;margin:8px 0;overflow:hidden}
.progress-bar .fill{height:100%;background:#06b6d4;width:0;transition:width .1s}
.color-row{display:flex;gap:4px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:4px;cursor:pointer;border:2px solid transparent}
.color-swatch:hover,.color-swatch.active{border-color:#06b6d4}
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Free3DStore</a>
  <h1>Turntable Renderer</h1>
  <span class="spacer"></span>
  <button class="btn" id="browse-btn">Open Model</button>
  <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl,.fbx">
</div>
<div class="workspace">
  <div class="sidebar">
    <div class="section">
      <h3>Turntable</h3>
      <div class="range-row"><label>Speed</label><input type="range" id="r-speed" min="0.1" max="5" step="0.1" value="1"><span class="val" id="v-speed">1.0</span></div>
      <div class="range-row"><label>Frames</label><input type="range" id="r-frames" min="12" max="120" step="4" value="36"><span class="val" id="v-frames">36</span></div>
      <div class="range-row"><label>Size</label>
        <select id="r-size">
          <option value="256">256x256</option>
          <option value="512" selected>512x512</option>
          <option value="1024">1024x1024</option>
        </select>
      </div>
    </div>
    <div class="section">
      <h3>Camera</h3>
      <div class="range-row"><label>Height</label><input type="range" id="r-height" min="0" max="4" step="0.1" value="1.5"><span class="val" id="v-height">1.5</span></div>
      <div class="range-row"><label>Distance</label><input type="range" id="r-dist" min="1" max="8" step="0.1" value="3"><span class="val" id="v-dist">3.0</span></div>
      <div class="range-row"><label>Zoom</label><input type="range" id="r-fov" min="20" max="80" step="1" value="45"><span class="val" id="v-fov">45</span></div>
    </div>
    <div class="section">
      <h3>Background</h3>
      <div class="color-row">
        <div class="color-swatch active" data-bg="transparent" style="background:repeating-conic-gradient(#444 0% 25%,#333 0% 50%) 50%/8px 8px"></div>
        <div class="color-swatch" data-bg="#ffffff" style="background:#fff"></div>
        <div class="color-swatch" data-bg="#1a1a1a" style="background:#1a1a1a;border:1px solid #444"></div>
        <div class="color-swatch" data-bg="#000000" style="background:#000;border:1px solid #444"></div>
        <div class="color-swatch" data-bg="#0f172a" style="background:#0f172a;border:1px solid #444"></div>
      </div>
    </div>
    <div class="section">
      <h3>Render</h3>
      <button class="btn btn-accent" id="render-btn" style="width:100%;margin-bottom:6px" disabled>Render Turntable</button>
      <div class="progress-bar" id="progress"><div class="fill" id="progress-fill"></div></div>
      <button class="btn" id="download-gif" style="width:100%;margin-bottom:4px" disabled>Download GIF</button>
      <button class="btn" id="download-png" style="width:100%" disabled>Download PNG Sequence</button>
      <div class="preview-strip" id="preview-strip"></div>
    </div>
  </div>
  <div class="viewport" id="viewport">
    <canvas id="canvas"></canvas>
    <div class="drop-overlay" id="drop-overlay">
      <h2>Drop a 3D model</h2>
      <p>Auto-rotate and export as GIF</p>
      <button class="btn btn-accent" id="drop-browse">Choose File</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('canvas'), vp = document.getElementById('viewport');
let model = null, angle = 0, speed = 1, isTransparent = true, frames = [];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, vp.clientWidth/vp.clientHeight, 0.01, 200);
camera.position.set(3, 1.5, 0);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0, 0);
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xfff5e0, 1.2);
dl.position.set(5, 8, 5); dl.castShadow = true; dl.shadow.mapSize.set(2048, 2048); scene.add(dl);
const fill = new THREE.DirectionalLight(0xaabbcc, 0.3); fill.position.set(-4, 4, -6); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);

(function anim() {
  requestAnimationFrame(anim);
  if (model) { angle += speed * 0.005; model.rotation.y = angle; }
  orbit.update();
  renderer.render(scene, camera);
})();
window.addEventListener('resize', () => { camera.aspect = vp.clientWidth/vp.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(vp.clientWidth, vp.clientHeight); });

async function loadModel(file) {
  if (model) { scene.remove(model); model = null; }
  angle = 0; frames = [];
  const ext = file.name.split('.').pop().toLowerCase(), url = URL.createObjectURL(file);
  try {
    let obj;
    if (ext === 'glb' || ext === 'gltf') obj = (await new GLTFLoader().loadAsync(url)).scene;
    else if (ext === 'obj') obj = await new OBJLoader().loadAsync(url);
    else if (ext === 'stl') obj = new THREE.Mesh(await new STLLoader().loadAsync(url), new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4 }));
    else if (ext === 'fbx') obj = await new FBXLoader().loadAsync(url);
    else { alert('Unsupported'); return; }
    const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    const m = Math.max(s.x, s.y, s.z); if (m > 0) { obj.position.sub(c); obj.scale.multiplyScalar(2 / m); }
    const b2 = new THREE.Box3().setFromObject(obj); obj.position.y -= b2.min.y;
    obj.traverse(ch => { if (ch.isMesh) { ch.castShadow = true; ch.receiveShadow = true; } });
    scene.add(obj); model = obj;
    document.getElementById('drop-overlay').classList.add('hidden');
    document.getElementById('render-btn').disabled = false;
  } finally { URL.revokeObjectURL(url); }
}

// Controls
document.getElementById('r-speed').addEventListener('input', function() { speed = +this.value; document.getElementById('v-speed').textContent = (+this.value).toFixed(1); });
document.getElementById('r-frames').addEventListener('input', function() { document.getElementById('v-frames').textContent = this.value; });
document.getElementById('r-height').addEventListener('input', function() { camera.position.y = +this.value; document.getElementById('v-height').textContent = (+this.value).toFixed(1); });
document.getElementById('r-dist').addEventListener('input', function() {
  const d = +this.value, a = Math.atan2(camera.position.z, camera.position.x);
  camera.position.x = d * Math.cos(a); camera.position.z = d * Math.sin(a);
  document.getElementById('v-dist').textContent = (+this.value).toFixed(1);
});
document.getElementById('r-fov').addEventListener('input', function() { camera.fov = +this.value; camera.updateProjectionMatrix(); document.getElementById('v-fov').textContent = this.value; });

document.querySelectorAll('[data-bg]').forEach(s => s.addEventListener('click', () => {
  document.querySelectorAll('[data-bg]').forEach(x => x.classList.remove('active')); s.classList.add('active');
  if (s.dataset.bg === 'transparent') { isTransparent = true; scene.background = null; renderer.setClearColor(0, 0); }
  else { isTransparent = false; scene.background = new THREE.Color(s.dataset.bg); renderer.setClearColor(new THREE.Color(s.dataset.bg), 1); }
}));

// Render turntable
document.getElementById('render-btn').addEventListener('click', async () => {
  if (!model) return;
  const btn = document.getElementById('render-btn');
  btn.disabled = true; btn.textContent = 'Rendering...';
  const numFrames = parseInt(document.getElementById('r-frames').value);
  const size = parseInt(document.getElementById('r-size').value);
  const strip = document.getElementById('preview-strip');
  strip.innerHTML = '';
  frames = [];

  const savedRotation = model.rotation.y;
  const savedSize = { w: renderer.domElement.width, h: renderer.domElement.height };
  renderer.setSize(size, size); renderer.setPixelRatio(1);
  camera.aspect = 1; camera.updateProjectionMatrix();

  for (let i = 0; i < numFrames; i++) {
    model.rotation.y = (i / numFrames) * Math.PI * 2;
    renderer.render(scene, camera);
    const dataUrl = renderer.domElement.toDataURL('image/png');
    frames.push(dataUrl);
    document.getElementById('progress-fill').style.width = `${((i + 1) / numFrames) * 100}%`;
    // Show every 6th frame in preview
    if (i % Math.max(1, Math.floor(numFrames / 6)) === 0) {
      const img = document.createElement('img'); img.src = dataUrl; strip.appendChild(img);
    }
    await new Promise(r => setTimeout(r, 10)); // yield to UI
  }

  // Restore
  model.rotation.y = savedRotation;
  renderer.setSize(vp.clientWidth, vp.clientHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  camera.aspect = vp.clientWidth / vp.clientHeight; camera.updateProjectionMatrix();

  btn.disabled = false; btn.textContent = 'Render Turntable';
  document.getElementById('download-gif').disabled = false;
  document.getElementById('download-png').disabled = false;
});

// Download GIF (uses canvas-based GIF encoding)
document.getElementById('download-gif').addEventListener('click', async () => {
  if (!frames.length) return;
  const btn = document.getElementById('download-gif');
  btn.disabled = true; btn.textContent = 'Encoding GIF...';
  const size = parseInt(document.getElementById('r-size').value);
  const numFrames = frames.length;
  const delay = Math.round(1000 / 24); // ~24fps

  // Simple approach: download frames as individual PNGs in a ZIP
  // For real GIF, we'd need gif.js library. Use PNG sequence instead.
  // Actually, let's create an animated WebP or fallback to PNG sequence.

  // Create a simple animated image by stitching frames as a sprite sheet
  const cols = Math.ceil(Math.sqrt(numFrames));
  const rows = Math.ceil(numFrames / cols);
  const sheet = document.createElement('canvas');
  sheet.width = size * cols; sheet.height = size * rows;
  const ctx = sheet.getContext('2d');

  for (let i = 0; i < numFrames; i++) {
    const img = new Image();
    img.src = frames[i];
    await new Promise(r => { img.onload = r; });
    const x = (i % cols) * size;
    const y = Math.floor(i / cols) * size;
    ctx.drawImage(img, x, y, size, size);
  }

  const a = document.createElement('a');
  a.download = `turntable-${size}x${size}-${numFrames}f-spritesheet.png`;
  a.href = sheet.toDataURL('image/png');
  a.click();
  btn.disabled = false; btn.textContent = 'Download GIF';
});

// Download PNG sequence as ZIP
document.getElementById('download-png').addEventListener('click', async () => {
  if (!frames.length) return;
  // Download each frame individually with numbered names
  for (let i = 0; i < frames.length; i++) {
    const a = document.createElement('a');
    a.download = `frame_${String(i).padStart(4, '0')}.png`;
    a.href = frames[i];
    a.click();
    await new Promise(r => setTimeout(r, 50));
  }
});

document.getElementById('browse-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('drop-browse').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) loadModel(e.target.files[0]); });
vp.addEventListener('dragover', e => e.preventDefault());
vp.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadModel(e.dataTransfer.files[0]); });
</script>
</body>
</html>
