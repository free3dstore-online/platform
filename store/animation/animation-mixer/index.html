<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animation Mixer - Free3DStore</title><meta name="description" content="Preview and control skeletal animations from GLB/FBX files. Play, pause, adjust speed, scrub timeline.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',system-ui,sans-serif;background:#111;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column}a{color:#06b6d4;text-decoration:none}.topbar{display:flex;align-items:center;padding:8px 16px;background:#1a1a1a;border-bottom:1px solid #333;gap:12px;flex-shrink:0}.topbar a{font-size:13px;color:#888}.topbar h1{font-size:15px;font-weight:700}.topbar .spacer{flex:1}.btn{padding:8px 16px;border:1px solid #444;border-radius:6px;background:#2a2a2a;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#e0e0e0}.btn:hover{border-color:#06b6d4;color:#06b6d4}.btn-accent{background:#06b6d4;color:#fff;border-color:#06b6d4}input[type=file]{display:none}.workspace{display:flex;flex:1;overflow:hidden}.sidebar{width:260px;background:#1a1a1a;border-right:1px solid #333;overflow-y:auto;padding:12px;flex-shrink:0}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.viewport{flex:1;position:relative;overflow:hidden}#canvas{width:100%;height:100%;display:block}.drop-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#888;z-index:10;background:#222}.drop-overlay h2{font-size:20px;font-weight:700;color:#e0e0e0}.drop-overlay.hidden{display:none}.timeline{display:flex;align-items:center;height:40px;background:#1a1a1a;border-top:1px solid #333;padding:0 12px;gap:8px;flex-shrink:0}.tl-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:14px;cursor:pointer;background:#2a2a2a;border:1px solid #444;color:#e0e0e0}.tl-btn:hover{border-color:#06b6d4}.tl-btn.active{background:#06b6d4;border-color:#06b6d4}.tl-slider{flex:1;accent-color:#06b6d4}.tl-time{font-size:12px;color:#888;width:60px;text-align:right;font-family:monospace}.section{margin-bottom:16px}.section h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:8px}.clip-item{padding:8px;background:#222;border:1px solid #333;border-radius:4px;margin-bottom:4px;cursor:pointer;font-size:12px}.clip-item:hover{border-color:#06b6d4}.clip-item.active{border-color:#06b6d4;background:rgba(6,182,212,.1)}.range-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}.range-row label{font-size:11px;color:#888;width:50px;flex-shrink:0}.range-row input[type=range]{flex:1;accent-color:#06b6d4}.range-row .val{font-size:11px;width:30px;text-align:right;color:#666}.empty-msg{text-align:center;padding:20px;color:#666;font-size:12px}</style>
</head><body>
<div class="topbar"><a href="/">← Free3DStore</a><h1>Animation Mixer</h1><span class="spacer"></span><button class="btn" id="browse-btn">Open Model</button><input type="file" id="file-input" accept=".glb,.gltf,.fbx"></div>
<div class="workspace"><div class="sidebar">
<div class="section"><h3>Animation Clips</h3><div id="clip-list"><div class="empty-msg">Load a model with animations</div></div></div>
<div class="section"><h3>Playback</h3>
<div class="range-row"><label>Speed</label><input type="range" id="r-speed" min="0.1" max="3" step="0.1" value="1"><span class="val" id="v-speed">1.0x</span></div>
</div></div>
<div class="main">
<div class="viewport" id="viewport"><canvas id="canvas"></canvas><div class="drop-overlay" id="drop-overlay"><h2>Drop GLB/FBX with animations</h2><p>Play, pause, scrub skeletal animations</p><button class="btn btn-accent" id="drop-browse">Choose File</button></div></div>
<div class="timeline"><button class="tl-btn" id="tl-play">▶</button><input type="range" class="tl-slider" id="tl-slider" min="0" max="1" step="0.001" value="0"><span class="tl-time" id="tl-time">0:00</span></div>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{FBXLoader}from'three/addons/loaders/FBXLoader.js';
const canvas=document.getElementById('canvas'),vp=document.getElementById('viewport');
let model=null,mixer=null,currentAction=null,clock=new THREE.Clock(),playing=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(50,vp.clientWidth/vp.clientHeight,0.01,200);camera.position.set(3,2,3);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(vp.clientWidth,vp.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;
const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.5));const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(4,6,4);scene.add(dl);scene.add(new THREE.GridHelper(6,6,0x444,0x333));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.ShadowMaterial({opacity:.15}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
(function anim(){requestAnimationFrame(anim);const dt=clock.getDelta();if(mixer&&playing)mixer.update(dt*parseFloat(document.getElementById('r-speed').value));if(currentAction&&!document.getElementById('tl-slider').matches(':active')){const t=currentAction.time/currentAction.getClip().duration;document.getElementById('tl-slider').value=t;const s=Math.floor(currentAction.time);document.getElementById('tl-time').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}orbit.update();renderer.render(scene,camera)})();
window.addEventListener('resize',()=>{camera.aspect=vp.clientWidth/vp.clientHeight;camera.updateProjectionMatrix();renderer.setSize(vp.clientWidth,vp.clientHeight)});
async function loadModel(file){if(model){scene.remove(model);model=null;mixer=null;currentAction=null}
const ext=file.name.split('.').pop().toLowerCase(),url=URL.createObjectURL(file);
try{let obj,animations=[];
if(ext==='glb'||ext==='gltf'){const g=await new GLTFLoader().loadAsync(url);obj=g.scene;animations=g.animations||[]}
else if(ext==='fbx'){obj=await new FBXLoader().loadAsync(url);animations=obj.animations||[]}
else return;
const box=new THREE.Box3().setFromObject(obj),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());const m=Math.max(s.x,s.y,s.z);if(m>0){obj.position.sub(c);obj.scale.multiplyScalar(2/m)}
const b2=new THREE.Box3().setFromObject(obj);obj.position.y-=b2.min.y;
scene.add(obj);model=obj;
if(animations.length){mixer=new THREE.AnimationMixer(obj);const list=document.getElementById('clip-list');list.innerHTML='';
animations.forEach((clip,i)=>{const div=document.createElement('div');div.className='clip-item'+(i===0?' active':'');div.textContent=`${clip.name||'Clip '+i} (${clip.duration.toFixed(1)}s)`;
div.addEventListener('click',()=>{document.querySelectorAll('.clip-item').forEach(x=>x.classList.remove('active'));div.classList.add('active');if(currentAction)currentAction.stop();currentAction=mixer.clipAction(clip);currentAction.play();playing=true;document.getElementById('tl-play').textContent='⏸'});
list.appendChild(div)});
currentAction=mixer.clipAction(animations[0]);currentAction.play()
}else{document.getElementById('clip-list').innerHTML='<div class="empty-msg">No animations found in this file</div>'}
document.getElementById('drop-overlay').classList.add('hidden')}finally{URL.revokeObjectURL(url)}}
document.getElementById('tl-play').addEventListener('click',()=>{playing=!playing;document.getElementById('tl-play').textContent=playing?'⏸':'▶'});
document.getElementById('tl-slider').addEventListener('input',function(){if(!currentAction)return;const clip=currentAction.getClip();currentAction.time=+this.value*clip.duration;mixer.update(0);playing=false;document.getElementById('tl-play').textContent='▶'});
document.getElementById('r-speed').addEventListener('input',function(){document.getElementById('v-speed').textContent=(+this.value).toFixed(1)+'x'});
document.getElementById('browse-btn').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('drop-browse').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])loadModel(e.target.files[0])});
vp.addEventListener('dragover',e=>e.preventDefault());vp.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadModel(e.dataTransfer.files[0])});
</script></body></html>
